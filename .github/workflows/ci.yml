name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //... --test_output=errors --verbose_failures

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Uncommitted changes detected after build/test (e.g. MODULE.bazel.lock). Please run the failing commands locally and commit the updated files."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install buildifier
        run: |
          go install github.com/bazelbuild/buildtools/buildifier@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run buildifier (format check)
        run: |
          buildifier --mode=check -r \
            --path=. \
            $(find . -name "*.bzl" -o -name "*.bazel" -o -name "BUILD" -o -name "WORKSPACE" \
              | grep -v tests/integration/broken_workspace)

      - name: Run buildifier (lint warnings)
        run: |
          buildifier --lint=warn -r \
            $(find . -name "*.bzl" -o -name "*.bazel" -o -name "BUILD" -o -name "WORKSPACE" \
              | grep -v tests/integration/broken_workspace)
