name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //... --test_output=errors --verbose_failures

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Uncommitted changes detected after build/test (e.g. MODULE.bazel.lock). Please run the failing commands locally and commit the updated files."
            exit 1
          fi

      - name: Fetch broken_workspace deps
        run: bazel fetch //...
        working-directory: tests/integration/broken_workspace

      - name: Check for uncommitted changes (broken_workspace)
        run: |
          if ! git diff --exit-code; then
            echo "::error::Uncommitted changes detected after fetching broken_workspace deps (e.g. MODULE.bazel.lock). Please run 'bazel fetch //...' in tests/integration/broken_workspace and commit the updated files."
            exit 1
          fi
